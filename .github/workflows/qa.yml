# Qualinaut pipeline (GitHub Actions), written by `qlt ci`. Edit freely.
# Made from project.yaml 5dcf58d6c808: `qlt doctor` says when it has changed.
# Fast job: committed generated tests (smoke or healthcheck) on every change.
# Scheduled job (0 22 * * *): `qlt run tests`, fails past `never`.
# Set these as CI secrets: QLT_GITHUB_TOKEN.
# QLT_GITHUB_TOKEN: a token that can read RomanDiachenko/qualinaut releases (Contents: read); qlt-install.py installs Qualinaut 0.5.6.2 with it.
# No generated web tests yet: run `qlt run tests` and commit them.
# Desktop targets (desktop): a job each on windows-latest, on the schedule;
# it builds the app, installs Appium's Windows driver, runs `qlt run tests`.
# Android targets (android): a job each on ubuntu-latest with an emulator (API 34),
# on the schedule; it builds the app, installs Appium with UiAutomator2, runs `qlt run tests --time 5h`.
# Links (web-android): a job each after the targets' jobs, with the suites they generated
# (a flow that generates tests, e.g. `--flow tests`): `qlt links`, then the link suite with both targets up.

name: qa
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 0 22 * * *
  workflow_dispatch:
    inputs:
      target:
        description: 'Explore only this target (its id; empty: every target)'
        required: false
        default: ''
        type: string
      chain:
        description: 'Set by the workflow itself: which run of a chain going on with an unfinished exploration (0: a new one)'
        required: false
        default: '0'
        type: string
jobs:
  explore:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == '' || inputs.target == 'web'))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions: &id001
      contents: read
      actions: write
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      QLT_CHAIN: ${{ inputs.chain || '0' }}
      QLT_CONTINUE: ${{ (inputs.chain || '0') != '0' && '--set ui-explorer.continue_unfinished=true' || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python qlt-install.py mobile
    - run: playwright install --with-deps chromium
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: build web
      run: cargo install --git https://github.com/hrach-gevorgyan/nyxdb --tag v0.1.8 --locked nyxdb --root .qlt-tools && cd offlog-app && npm ci
    - uses: actions/cache/restore@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: qlt-cache-
    - run: qlt doctor
      continue-on-error: true
    - run: qlt run tests --target web --fail-on never --time 5h $QLT_CONTINUE
    - if: always()
      uses: actions/cache/save@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-${{ github.run_id }}-${{ github.run_attempt }}
    - name: go on in a next run if the map is unfinished
      if: '!cancelled() && github.event_name != ''pull_request'''
      env:
        GH_TOKEN: ${{ github.token }}
      run: "chain=\"${QLT_CHAIN:-0}\"\nworkflow=\"${GITHUB_WORKFLOW_REF%@*}\"\nworkflow=\"${workflow##*/}\"\nif [ \"$chain\" -ge 20 ]; then\n  echo \"20 runs in a row: not going on (start the workflow to go on)\"\n  exit 0\nfi\nif qlt unfinished --target web; then\n  gh workflow run \"$workflow\" -R \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f target=web -f chain=$((chain + 1))\nfi\n"
    - if: always()
      run: qlt report --format md >> "$GITHUB_STEP_SUMMARY" || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa
        path: '.qlt/artifacts

          generated-tests

          golden'
  desktop-desktop:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == '' || inputs.target == 'desktop'))
    runs-on: windows-latest
    timeout-minutes: 355
    permissions: *id001
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      QLT_CHAIN: ${{ inputs.chain || '0' }}
      QLT_CONTINUE: ${{ (inputs.chain || '0') != '0' && '--set ui-explorer.continue_unfinished=true' || '' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/cache@v4
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          offlog-desktop/src-tauri/target'
        key: cargo-{{ runner.os }}-{{ hashFiles('offlog-desktop/src-tauri/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-
    - name: build desktop
      run: cd offlog-app && npm ci && npm run build && cd ../offlog-desktop && pwsh -File scripts/fetch-nyxdb-win.ps1 && cd src-tauri && cargo build
    - name: Appium with the Windows driver
      run: 'npm install -g appium

        appium driver install windows'
    - name: WinAppDriver
      shell: pwsh
      run: '$exe = "${env:ProgramFiles(x86)}\Windows Application Driver\WinAppDriver.exe"

        if (-not (Test-Path $exe)) { choco install winappdriver -y --no-progress }

        reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

        '
    - run: python qlt-install.py mobile
    - uses: actions/cache/restore@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-desktop-desktop-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: qlt-cache-desktop-desktop-
    - run: qlt doctor
      continue-on-error: true
    - run: qlt run tests --target desktop --fail-on never --time 5h $QLT_CONTINUE
    - if: always()
      uses: actions/cache/save@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-desktop-desktop-${{ github.run_id }}-${{ github.run_attempt }}
    - name: go on in a next run if the map is unfinished
      if: '!cancelled() && github.event_name != ''pull_request'''
      env:
        GH_TOKEN: ${{ github.token }}
      run: "chain=\"${QLT_CHAIN:-0}\"\nworkflow=\"${GITHUB_WORKFLOW_REF%@*}\"\nworkflow=\"${workflow##*/}\"\nif [ \"$chain\" -ge 20 ]; then\n  echo \"20 runs in a row: not going on (start the workflow to go on)\"\n  exit 0\nfi\nif qlt unfinished --target desktop; then\n  gh workflow run \"$workflow\" -R \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f target=desktop -f chain=$((chain + 1))\nfi\n"
    - if: always()
      run: qlt report --format md > qa-report.md && cat qa-report.md >> "$GITHUB_STEP_SUMMARY" || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-desktop-desktop
        path: '.qlt/artifacts

          generated-tests

          golden

          qa-report.md'
  android-android:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.target == '' || inputs.target == 'android'))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions: *id001
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      QLT_CHAIN: ${{ inputs.chain || '0' }}
      QLT_CONTINUE: ${{ (inputs.chain || '0') != '0' && '--set ui-explorer.continue_unfinished=true' || '' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: build android
      run: npm ci && npm run build && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      working-directory: offlog-app
    - name: free the build's memory
      run: 'pkill -f ''[G]radleDaemon'' || true

        pkill -f ''[K]otlinCompileDaemon'' || true

        '
    - name: room for the emulator
      run: 'sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules/@azure /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL

        rm -rf ~/.gradle/caches/build-cache-* ~/.gradle/daemon

        df -h / && free -m

        '
    - name: KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Appium with UiAutomator2
      run: 'npm install -g appium

        appium driver install uiautomator2'
    - run: python qlt-install.py mobile
    - uses: actions/cache/restore@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-android-android-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: qlt-cache-android-android-
    - name: explore android on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        ram-size: 3072M
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
        disable-animations: true
        script: 'nohup sh -c ''while true; do echo "$(date -u +%H:%M) memory free $(free -m | awk "/Mem/{print \$7}") MB, disk free $(df -h / | awk "NR==2{print \$4}")"; sleep 300; done'' > ~/qlt-runner.log 2>&1 &

          qlt doctor || true

          qlt run tests --target android --fail-on never --time 5h $QLT_CONTINUE'
    - name: what the runner had left
      if: always()
      run: 'cat ~/qlt-runner.log || true

        df -h / && free -m

        '
    - if: always()
      uses: actions/cache/save@v4
      with:
        path: '.qlt/cache

          .qlt/qlt.db

          .qlt/qlt.db-wal

          .qlt/qlt.db-shm'
        key: qlt-cache-android-android-${{ github.run_id }}-${{ github.run_attempt }}
    - name: go on in a next run if the map is unfinished
      if: '!cancelled() && github.event_name != ''pull_request'''
      env:
        GH_TOKEN: ${{ github.token }}
      run: "chain=\"${QLT_CHAIN:-0}\"\nworkflow=\"${GITHUB_WORKFLOW_REF%@*}\"\nworkflow=\"${workflow##*/}\"\nif [ \"$chain\" -ge 20 ]; then\n  echo \"20 runs in a row: not going on (start the workflow to go on)\"\n  exit 0\nfi\nif qlt unfinished --target android; then\n  gh workflow run \"$workflow\" -R \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f target=android -f chain=$((chain + 1))\nfi\n"
    - if: always()
      run: qlt report --format md > qa-report.md && cat qa-report.md >> "$GITHUB_STEP_SUMMARY" || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-android-android
        path: '.qlt/artifacts

          generated-tests

          golden

          qa-report.md'
  links-web-android:
    if: '!cancelled() && (github.event_name == ''schedule'' || (github.event_name == ''workflow_dispatch'' && (inputs.target == '''')))'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      QLT_CHAIN: ${{ inputs.chain || '0' }}
      QLT_CONTINUE: ${{ (inputs.chain || '0') != '0' && '--set ui-explorer.continue_unfinished=true' || '' }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: build android
      run: npm ci && npm run build && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      working-directory: offlog-app
    - name: free the build's memory
      run: 'pkill -f ''[G]radleDaemon'' || true

        pkill -f ''[K]otlinCompileDaemon'' || true

        '
    - name: room for the emulator
      run: 'sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules/@azure /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL

        rm -rf ~/.gradle/caches/build-cache-* ~/.gradle/daemon

        df -h / && free -m

        '
    - name: build web
      run: cargo install --git https://github.com/hrach-gevorgyan/nyxdb --tag v0.1.8 --locked nyxdb --root .qlt-tools && cd offlog-app && npm ci
    - run: python qlt-install.py mobile
    - run: playwright install --with-deps chromium
    - name: the suites the targets' jobs generated
      uses: actions/download-artifact@v4
      with:
        pattern: qa*
        path: ${{ runner.temp }}/qlt-suites
    - name: the link suite web-android
      run: "mkdir -p generated-tests\nfor d in $(find \"${{ runner.temp }}/qlt-suites\" -name index.json -exec dirname {} \\;); do\n  case \"$(basename \"$d\")\" in web|android) rm -rf \"generated-tests/$(basename \"$d\")\" && cp -r \"$d\" generated-tests/ ;; esac\ndone\nqlt links\npip install -r generated-tests/web/requirements.txt -r generated-tests/android/requirements.txt\n"
    - name: KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Appium with UiAutomator2
      run: 'npm install -g appium

        appium driver install uiautomator2'
    - name: web-android with android on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        ram-size: 3072M
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
        disable-animations: true
        script: 'adb reverse tcp:5173 tcp:5173

          adb reverse tcp:5984 tcp:5984

          nohup appium > appium.log 2>&1 &

          timeout 120 bash -c ''until curl -fs http://127.0.0.1:4723/status >/dev/null; do sleep 2; done''

          qlt serve --target web -- pytest generated-tests/links/web-android --junitxml=generated-tests/links/web-android/results.xml'
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-links-web-android
        path: generated-tests/links/web-android
    needs:
    - explore
    - android-android
