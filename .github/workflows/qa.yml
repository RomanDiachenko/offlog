# Qualinaut parity check (branch qlt-parity): record a golden master of the web app at
# one offlog-app commit, then compare a later commit against it.
# Start: gh workflow run qa -R RomanDiachenko/offlog --ref qlt-parity -f target=web

name: qa
'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Target id (web only here)'
        required: false
        default: 'web'
        type: string
      chain:
        description: 'Unused here'
        required: false
        default: '0'
        type: string
      reference:
        description: 'offlog-app commit the golden master is recorded from'
        required: false
        default: '291590d'
        type: string
      subject:
        description: 'offlog-app commit compared with the golden master'
        required: false
        default: '2221601'
        type: string
      qualinaut:
        description: 'Qualinaut git ref to install'
        required: false
        default: 'feat/parity-real-app'
        type: string
      profile:
        description: 'Limits profile'
        required: false
        default: 'quick'
        type: string
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      QLT_GITHUB_TOKEN: ${{ secrets.QLT_GITHUB_TOKEN }}
      REFERENCE: ${{ inputs.reference }}
      SUBJECT: ${{ inputs.subject }}
      PROFILE: ${{ inputs.profile }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: install Qualinaut ${{ inputs.qualinaut }}
      run: pip install "qualinaut[mobile] @ git+https://x-access-token:${QLT_GITHUB_TOKEN}@github.com/RomanDiachenko/qualinaut@${{ inputs.qualinaut }}"
    - run: playwright install --with-deps chromium
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: offlog-app at the reference commit
      run: |
        rm -rf offlog-app && git checkout "$REFERENCE" -- offlog-app
        git log -1 --format='%h %s' "$REFERENCE"
        (cd offlog-app && npm ci)
    - name: record the golden master
      run: qlt run golden --target web --profile "$PROFILE" --fail-on never
    - name: keep the golden master, drop the reference's map
      run: |
        ls -la golden && head -c 2000 golden/web.json
        mkdir -p out && cp -r .qlt/artifacts out/golden-run
        rm -rf .qlt
    - name: offlog-app at the subject commit
      run: |
        git rm -rq --cached offlog-app >/dev/null; rm -rf offlog-app
        git checkout "$SUBJECT" -- offlog-app
        git log -1 --format='%h %s' "$SUBJECT"
        (cd offlog-app && npm ci)
    - name: compare with the golden master
      run: qlt run parity --target web --profile "$PROFILE" --fail-on never
    - if: always()
      run: |
        for f in $(find .qlt/artifacts -name '*.comparison.md'); do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
        qlt report --format md >> "$GITHUB_STEP_SUMMARY" || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity
        path: |
          .qlt/artifacts
          out
          golden
