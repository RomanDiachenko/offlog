<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Offlog</title>
    <!-- The Android launch cover: the splash's colours (android colors.xml
         splashBg, light and night; app.css --hero-base) and its white mark at
         the splash icon's size, shown only when theme-init.js sets
         html.launching. Before the stylesheet loads, so hex here. -->
    <style>
      #launch { display: none; }
      html.launching #launch { display: flex; position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; background: #575fca; }
      html.launching.launch-dark #launch { background: #373d81; }
      #launch svg { width: 187px; height: 187px; fill: #ffffff; }
    </style>
    <!-- PouchDB loaded as UMD global to avoid Vite/CJS bundler conflicts -->
    <script src="/pouchdb.js"></script>
  </head>
  <body>
    <script src="/theme-init.js"></script>
    <!--launch-cover-->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
